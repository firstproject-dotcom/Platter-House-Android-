YAML

name: Platter House Android APK Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking repository files..."
          ls -la
          if [ ! -f gradlew ]; then
            echo "ERROR: No gradlew file found in the repository root."
            echo "The Android project files must be uploaded before an APK can be built."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Platter-House-Android-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
